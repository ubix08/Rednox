name = "rednox"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[assets]
directory = "public"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "rednox-db"
database_id = "274002eb-d1a4-4c58-97a5-489b6dd18d60"

# Durable Objects
[[durable_objects.bindings]]
name = "FLOW_EXECUTOR"
class_name = "FlowExecutorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlowExecutorDO"]

# Increased CPU limit for complex agent operations (5 minutes)
[durable_objects.limits]
cpu_ms = 300000
